<!doctype html>
<meta charset="utf-8">
<title>Colour field frames</title>
<!--
  Paints the frames of the letter's colour animation (colour_field.webp) and sends them to
  save_frames.py. It paints soft rainbow dots
  (the same colours, sizes, opacity and blur as decree.html's defaults) drifting slowly.

  To loop without a jump, every dot travels a whole number of tile widths or heights in one
  loop, and the tile wraps around at its edges, so the last frame flows into the first.
  The same tile is stacked under each paragraph, so it also has to match top to bottom.
-->
<body style="background:#111;color:#ccc;font:14px system-ui">
<p id="status">Rendering…</p>
<script type="module">
import { paintFrame, frame, LOOP_SECONDS, FRAMES_PER_SECOND } from "./colour_field.js";
document.body.append(frame);

(async () => {
  const total = LOOP_SECONDS * FRAMES_PER_SECOND;
  for (let n = 0; n < total; n++) {
    paintFrame(n / total);
    const png = await new Promise((resolve) => frame.toBlob(resolve, "image/png"));
    await fetch(`/frame/${String(n).padStart(4, "0")}`, { method: "POST", body: png });
    document.getElementById("status").textContent = `Frame ${n + 1} of ${total}`;
  }
  document.getElementById("status").textContent = "Done";
  window.renderDone = true;
})();
</script>
</body>
